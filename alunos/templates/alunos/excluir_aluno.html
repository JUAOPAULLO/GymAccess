{% extends 'alunos/base.html' %}

{% block title %}Excluir Pacote{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow-sm border-0">

        <div class="card-body p-4">

            <h3 class="text-danger fw-bold mb-4">

                <i class="bi bi-exclamation-triangle-fill"></i>
                Confirmar Exclusão

            </h3>

            <p class="mb-4">

                Tem certeza que deseja excluir o pacote do aluno
                <strong>{{ pacote.aluno.nome }}</strong>?

            </p>

            <form method="POST">

                {% csrf_token %}

                <button type="submit" class="btn btn-danger">

                    <i class="bi bi-trash"></i>
                    Excluir

                </button>

                <a href="{% url 'lista_pacotes' %}" class="btn btn-secondary">

                    <i class="bi bi-arrow-left"></i>
                    Voltar

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
