{% extends 'alunos/base.html' %}

{% block content %}

<div class="card shadow-sm border-0 mx-auto" style="max-width: 600px;">

    <div class="card-header bg-primary text-white">

        <h3 class="mb-0 fw-bold text-center">

            <i class="bi bi-shield-check"></i>
            Validação do QR Code

        </h3>

    </div>


    <div class="card-body text-center p-3 p-md-4">

        <!-- ALUNO -->

        <h4 class="fw-bold mb-2">
            {{ qrcode.aluno.nome }}
        </h4>


        <!-- PACOTE -->

        <p class="mb-4">

            Pacote:

            <strong>
                {{ qrcode.pacote.acessos_restantes }}/{{ qrcode.pacote.total_acessos }}
            </strong>

            acessos restantes

        </p>


        <!-- QR CODE -->

        <div class="d-flex justify-content-center mb-4">

            <div
                class="p-2 bg-white border rounded"
                style="width: min(300px, 80vw);">

                <img
                    src="{{ qrcode.imagem.url }}"
                    class="img-fluid d-block mx-auto"
                    style="width: 100%; height: auto;"
                    alt="QR Code">

            </div>

        </div>


        <hr>


        <!-- RESULTADO -->

        {% if sucesso %}

            <div class="alert alert-success mb-3">

                <i class="bi bi-check-circle-fill"></i>

                {{ mensagem }}

            </div>

        {% else %}

            <div class="alert alert-danger mb-3">

                <i class="bi bi-x-circle-fill"></i>

                {{ mensagem }}

            </div>

        {% endif %}


        <!-- VOLTAR -->

        <a
            href="{% url 'lista_pacotes' %}"
            class="btn btn-primary mt-2">

            <i class="bi bi-arrow-left"></i>

            Voltar

        </a>

    </div>

</div>

{% endblock %}
