{% extends 'alunos/base.html' %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-success text-white">

                    <h4 class="mb-0 fw-bold">
                        Cadastrar Pacote
                    </h4>

                </div>

                <div class="card-body p-4">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Aluno
                            </label>

                            <select
                                name="aluno"
                                class="form-select"
                                required>

                                {% for aluno in alunos %}

                                <option value="{{ aluno.id }}">
                                    {{ aluno.nome }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Quantidade de acessos
                            </label>

                            <input
                                type="number"
                                name="total_acessos"
                                class="form-control"
                                min="1"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            <i class="bi bi-check-circle"></i>
                            Salvar Pacote

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
